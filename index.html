<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literární psaní všemi deseti</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="container">
        <h1>Literární psaní všemi deseti</h1>
        <p class="lede">Osm maturitních knih, u každé čtyři lekce o době, žánru a literárním kontextu.</p>

        <div class="controls">
            <div class="field">
                <label for="lessonSelect">Lekce</label>
                <select id="lessonSelect"></select>
            </div>
            <div class="actions">
                <button type="button" id="nextBtn">Další lekce</button>
                <button type="button" id="resetBtn" class="secondary">Znovu</button>
            </div>
        </div>
        <p id="lessonMeta" class="lesson-meta"><span id="metaBook"></span><span id="metaTitle"></span><span id="metaLength"></span></p>

        <div class="stats">
            <div class="stat-box"><span class="stat-label">Slov za minutu</span><span class="stat-value" id="wpm">0</span></div>
            <div class="stat-box"><span class="stat-label">Přesnost</span><span class="stat-value"><span id="accuracy">100</span>%</span></div>
            <div class="stat-box"><span class="stat-label">Postup</span><span class="stat-value"><span id="progress">0</span>%</span></div>
        </div>
        <div class="progress-track" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Postup v lekci">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="typing-area" id="typingArea">
            <div id="textContainer" aria-hidden="true"></div>
            <label class="sr-only" for="typingInput">Opisovaný text</label>
            <input id="typingInput" class="typing-capture" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="instruction">
            <button type="button" class="overlay" id="overlay">Klikněte sem nebo stiskněte Enter a začněte psát</button>
        </div>

        <p class="instruction" id="instruction">Šedý text ještě čeká, zelený je správně, červený je chyba. Chyba zůstane v přesnosti i po smazání.</p>
        <p id="liveStatus" class="sr-only" aria-live="polite"></p>
        <pre id="debugPanel" class="debug-panel hidden" aria-hidden="true"></pre>
    </main>
    <script src="js/lessons.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
